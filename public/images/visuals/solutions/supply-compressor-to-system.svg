<g id="control"><rect width="41" height="78" rx="3" fill="#edf2e8" stroke="#87977c" stroke-width="3" stroke-dasharray="6 4"/><rect x="8" y="13" width="25" height="20" fill="#ccd9c2"/><circle cx="13" cy="51" r="4" fill="#b74726"/><circle cx="28" cy="51" r="4" fill="#657b60"/></g>
</defs>
