<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">От компрессора к согласованной комплектации</title>
<desc id="desc">Три варианта: компрессор, компрессор с необходимыми охлаждением и КИП, комплектная система. Дополнительные элементы показаны пунктиром.</desc>
