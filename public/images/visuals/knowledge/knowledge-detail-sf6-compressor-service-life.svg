<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Факторы срока службы компрессора SF₆"><title>Факторы срока службы компрессора SF₆</title><rect width="900" height="600" fill="#fafbf7"/><text x="450" y="70" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600" text-anchor="middle" fill="#243e32">Факторы срока службы компрессора SF₆</text><rect x="55" y="120" width="340" height="84" rx="14" fill="#dce8dc" stroke="#a9bcad" stroke-width="3"/><text x="225" y="158" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#243e32">Состояние газа</text><text x="225" y="185" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#4e6658">Анализ и предыстория применения.</text><rect x="505" y="120" width="340" height="84" rx="14" fill="#dce8dc" stroke="#a9bcad" stroke-width="3"/><text x="675" y="158" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#243e32">Влага</text><text x="675" y="185" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#4e6658">Условия газового тракта.</text><rect x="55" y="232" width="340" height="84" rx="14" fill="#dce8dc" stroke="#a9bcad" stroke-width="3"/><text x="225" y="270" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#243e32">Продукты разложения</text><text x="225" y="297" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#4e6658">Состав и безопасное обращение.</text><rect x="505" y="232" width="340" height="84" rx="14" fill="#dce8dc" stroke="#a9bcad" stroke-width="3"/><text x="675" y="270" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#243e32">Температура</text><text x="675" y="297" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#4e6658">Газ и теплоотвод.</text><rect x="55" y="344" width="340" height="84" rx="14" fill="#dce8dc" stroke="#a9bcad" stroke-width="3"/><text x="225" y="382" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#243e32">Режим</text><text x="225" y="409" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#4e6658">Циклы, нагрузки и пуски.</text><rect x="505" y="344" width="340" height="84" rx="14" fill="#dce8dc" stroke="#a9bcad" stroke-width="3"/><text x="675" y="382" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#243e32">Уплотнения и клапаны</text><text x="675" y="409" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#4e6658">Состояние и герметичность.</text><rect x="55" y="456" width="340" height="84" rx="14" fill="#dce8dc" stroke="#a9bcad" stroke-width="3"/><text x="225" y="494" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#243e32">Обслуживание</text><text x="225" y="521" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#4e6658">По документации выбранного исполнения.</text></svg>