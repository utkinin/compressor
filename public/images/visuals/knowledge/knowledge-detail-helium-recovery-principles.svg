<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Возврат гелия в технологический процесс"><title>Возврат гелия в технологический процесс</title><rect width="900" height="600" fill="#fafbf7"/><text x="450" y="70" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600" text-anchor="middle" fill="#243e32">Возврат гелия в технологический процесс</text><rect x="125" y="115" width="650" height="84" rx="14" fill="#dce8dc" stroke="#a9bcad" stroke-width="3"/><text x="450" y="152" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#243e32">Процесс</text><text x="450" y="181" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#4e6658">Возвратный поток гелия.</text><path d="M450 206L450 223" fill="none" stroke="#b84f2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M443.2 211.9L450 223L456.8 211.9" fill="none" stroke="#b84f2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="125" y="227" width="650" height="84" rx="14" fill="#efd4ba" stroke="#a9bcad" stroke-width="3"/><text x="450" y="264" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#243e32">Сбор и буфер</text><text x="450" y="293" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#4e6658">Согласование с циклом.</text><path d="M450 318L450 335" fill="none" stroke="#b84f2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M443.2 323.9L450 335L456.8 323.9" fill="none" stroke="#b84f2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="125" y="339" width="650" height="84" rx="14" fill="#dce8dc" stroke="#a9bcad" stroke-width="3"/><text x="450" y="376" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="