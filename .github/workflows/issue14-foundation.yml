name: Issue 14 integrators foundation

on:
  push:
    branches: [feature/issue-14-integrators-foundation]

permissions:
  contents: write

concurrency:
  group: issue-14-foundation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply foundation patch
        run: |
          python3 scripts/apply-issue14-foundation.py
          python3 scripts/apply-issue14-integration.py
      - run: npm ci
      - name: Validate source
        run: |
          npm run typecheck
          npm run lint
          npm test
      - run: npx playwright install --with-deps chromium
      - name: Build and server E2E
        run: |
          npm run build
          npm run test:e2e
      - name: Static preview acceptance
        run: |
          npm run preview:build
          python3 scripts/audit-public-copy.py
          npm run preview:test
      - name: Commit validated product diff
        run: |
          git config user.name "Lanfor automation"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 1
          fi
          git commit -m "Add integrators project-sales foundation [skip ci] [issue14-foundation]"
          git push origin HEAD:${GITHUB_REF_NAME}
