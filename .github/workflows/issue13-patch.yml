name: Issue 13 patch and validation

on:
  push:
    branches: [fix/issue-13-gasbadge-oilfree]

permissions:
  contents: write

concurrency:
  group: issue-13-patch
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use pinned Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply Issue 13 patch
        run: python3 scripts/apply-issue13.py
      - name: Install from lockfile
        run: npm ci
      - name: Validate source
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and run browser acceptance
        run: |
          npm run build
          npm run test:e2e
      - name: Build and test exact static preview
        run: |
          npm run preview:build
          python3 scripts/audit-public-copy.py
          npm run preview:test
      - name: Commit validated patch
        run: |
          git config user.name "Lanfor automation"
          git config user.email "actions@users.noreply.github.com"
          git add src public tests
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 1
          fi
          git commit -m "Implement gas badges and oil-free positioning [skip ci] [issue13-applied]"
          git push origin HEAD:${GITHUB_REF_NAME}
